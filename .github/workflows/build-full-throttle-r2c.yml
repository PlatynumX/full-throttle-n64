name: Build Full Throttle N64 r2c

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-full-throttle-r2c.yml"
      - "backend/**"
      - "probe/**"
      - "scripts/**"
      - "docs/**"
      - "demo/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bzip2 ca-certificates curl file git \
            libmpc-dev libmpfr-dev make python3 texinfo unzip wget zlib1g-dev

      - name: Preflight
        run: bash ./scripts/preflight.sh

      - name: Fetch pinned ScummVM and libdragon
        run: |
          mkdir -p artifacts
          bash ./scripts/fetch_source.sh | tee artifacts/scummvm-source.txt
          bash ./scripts/fetch_libdragon.sh | tee artifacts/libdragon-source.txt

      - name: Fetch and stage official Full Throttle demo
        run: |
          bash ./scripts/fetch_demo.sh
          bash ./scripts/stage_demo_sd.sh

      - name: Install current prebuilt libdragon toolchain
        run: |
          curl -fL --retry 5 --retry-all-errors \
            -o /tmp/gcc-toolchain-mips64-x86_64.deb \
            https://github.com/DragonMinded/libdragon/releases/download/toolchain-continuous-prerelease/gcc-toolchain-mips64-x86_64.deb
          sudo dpkg -i /tmp/gcc-toolchain-mips64-x86_64.deb
          export N64_INST=/opt/libdragon
          export PATH="$N64_INST/bin:$PATH"
          echo "N64_INST=$N64_INST" >> "$GITHUB_ENV"
          echo "$N64_INST/bin" >> "$GITHUB_PATH"
          mips64-elf-gcc --version | head -1 | tee artifacts/toolchain-version.txt
          bash ./scripts/build_libdragon.sh

      - name: Integrate r2c backend
        run: bash ./scripts/integrate_backend.sh

      - name: Build standalone SummerCart SD probe
        id: probe
        continue-on-error: true
        run: bash ./scripts/build_probe.sh

      - name: Build ScummVM Full Throttle integration
        id: scummvm
        continue-on-error: true
        run: bash ./scripts/build_scummvm.sh

      - name: Record final diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          {
            echo "Probe outcome: ${{ steps.probe.outcome }}"
            echo "ScummVM integration outcome: ${{ steps.scummvm.outcome }}"
            echo
            echo "Artifact files:"
            find artifacts -type f -printf '%P %s bytes\n' | sort
          } > artifacts/r2c-summary.txt

          if [ -d work/scummvm/.git ]; then
            git -C work/scummvm diff --check \
              > artifacts/scummvm-git-diff-check.txt 2>&1 || true
            git -C work/scummvm status --short \
              > artifacts/scummvm-git-status.txt || true
          fi

          if [ -d work/libdragon/.git ]; then
            git -C work/libdragon rev-parse HEAD \
              > artifacts/libdragon-commit.txt || true
          fi

      - name: Upload r2c ROMs, demo payload, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-throttle-n64-r2c-build-report
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Fail if either N64 build failed
        if: steps.probe.outcome != 'success' || steps.scummvm.outcome != 'success'
        run: |
          echo "Probe outcome: ${{ steps.probe.outcome }}"
          echo "ScummVM outcome: ${{ steps.scummvm.outcome }}"
          echo "Both logs were preserved in the r2c build-report artifact."
          exit 1
